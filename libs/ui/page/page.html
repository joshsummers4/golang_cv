<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>{{ .Title }}</title>
    <link rel="icon" href="/public/cv/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/public/cv/favicon.svg" type="image/svg+xml" />
    {{ if .Description}}
      <meta name="description" content="{{ .Description }}" />
    {{ end }}
    <meta name="google-site-verification" content="QtFO9MMz7UzFUjAxS2un2JMsBwjhOhbsk1Khxqs_pfs" />
    <link rel="stylesheet" href="/public/styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>    

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,200..1000;1,200..1000&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Material+Symbols+Outlined&display=swap"
      rel="stylesheet"
    />
    <script defer src="/public/htmx.min.js"></script>
    <script defer src="/public/htmx-response-target.js"></script>
    <script defer src="/public/alpine.min.js"></script>
    <script defer src="/public/prism.js"></script>


  </head>
  <body class="flex flex-col gap-2 md:gap-4 w-full min-h-screen mx-auto max-w-[100ch] text-white bg-gray-800">
    {{ .Main }}
    {{ .Loading }}
  </body>
</html>
