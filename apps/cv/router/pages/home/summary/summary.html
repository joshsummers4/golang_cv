<section class="flex flex-col gap-2 justify-center items-center">
    <p class="text-5xl">Josh Summers B.Sc</p>
    <p class="text-2xl">Web Developer</p>
    <div id="contact" class="prose flex flex-col sm:flex-row gap-4">
        {{ if .Email}}
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined">email</span>
            <a href="mailto:{{ .Email }}">{{ .Email }}</a>
        </div>
        {{ end }}
        {{ if .Phone }}
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined">phone</span>
            <span>{{ .Phone }}</span>
        </div>
        {{ end }}
        {{ if .Address }}
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined">location_on</span>
            <span>{{ .Address }}</span>
        </div>
        {{ end }}
    </div>
    <div id="links" class="prose flex flex-col sm:flex-row gap-4">
        <div>
            <!-- linkedin favicon -->
            <span>LinkedIn: <a href="{{.LinkedIn}}">{{.LinkedIn}}</a></span>
        </div>
        <div>
            <!-- github favicon -->
            <span>Github: <a href="{{.GitHub}}">{{.GitHub}}</a></span>
        </div>
    </div>
</section>
