<div class="border-b-2">
    <div class="p-2 md:p-4">
        <span class="text-3xl">Technical Skills</span>
        <div class="flex flex-col">
            <div class="p-2">
                <p class="text-l">Frontend</p>
                <div class="flex flex-row flex-wrap gap-2">
                    {{ range .Frontend }}
                        {{ . }}
                    {{ end }}
                </div>
            </div>
            <div class="p-2">
                <p class="text-l">Backend & Databases</p>
                <div class="flex flex-row flex-wrap gap-2">
                    {{ range .Backend }}
                        {{ . }}
                    {{ end }}
                </div>
            </div>
            <div class="p-2">
                <p class="text-l">DevOps</p>
                <div class="flex flex-row flex-wrap gap-2">
                    {{ range .DevOps }}
                        {{ . }}
                    {{ end }}
                </div>
            </div>
            <div class="p-2">
                <p class="text-l">Testing & Deployment</p>
                <div class="flex flex-row flex-wrap gap-2">
                    {{ range .Testing }}
                        {{ . }}
                    {{ end }}
                </div>
            </div>
        </div>
    </div>
</div>
